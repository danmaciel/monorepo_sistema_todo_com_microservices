version: '3.8'

services:
  # ============================================
  # DATABASES
  # ============================================
  user-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d usersdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  todo-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: todosdb
      POSTGRES_USER: todos_app
      POSTGRES_PASSWORD: ${TODO_DB_PASSWORD:?Set TODO_DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - todo_postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todos_app -d todosdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local-only distributed tracing backend (do not expose publicly)
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "127.0.0.1:9411:9411"
    networks:
      - todo-network

  # ============================================
  # SERVICE REGISTRY & DISCOVERY
  # ============================================
  eureka:
    build:
      context: ./packages/eureka-server
      dockerfile: Dockerfile
    container_name: todo-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: eureka
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - todo-network
    depends_on:
      - user-db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # ============================================
  # API GATEWAY
  # ============================================
  gateway:
    build:
      context: ./packages/api-gateway
      dockerfile: Dockerfile
    container_name: todo-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - todo-network
    depends_on:
      eureka:
        condition: service_healthy

  # ============================================
  # MICROSERVICES
  # ============================================
  user-service:
    build:
      context: ./packages/user-service
      dockerfile: Dockerfile
    container_name: todo-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/usersdb
      SPRING_DATASOURCE_USERNAME: users_app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS: ${JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS:-true}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-86400000}
      AUTH_REFRESH_HTTP_ENABLED: ${AUTH_REFRESH_HTTP_ENABLED:-false}
      AUTH_REFRESH_ALLOWED_ORIGINS: ${AUTH_REFRESH_ALLOWED_ORIGINS:-}
      AUTH_REFRESH_CSRF_KEY_BASE64: ${AUTH_REFRESH_CSRF_KEY_BASE64:-}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in your environment}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - todo-network
    depends_on:
      user-db:
        condition: service_healthy
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 50s

  todo-service:
    build:
      context: ./packages/todo-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_DATASOURCE_URL: jdbc:postgresql://todo-db:5432/todosdb
      SPRING_DATASOURCE_USERNAME: todos_app
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS: ${JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS:-true}
      SPRING_DATASOURCE_PASSWORD: ${TODO_DB_PASSWORD:?Set TODO_DB_PASSWORD in your environment}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - todo-network
    depends_on:
      todo-db:
        condition: service_healthy
      eureka:
        condition: service_healthy
      user-service:
        condition: service_healthy

  # ============================================
  # FRONTEND
  # ============================================
  web-app:
    build:
      context: ./packages/web-app
      dockerfile: Dockerfile
    container_name: todo-web
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - todo-network
    depends_on:
      - gateway

networks:
  todo-network:
    driver: bridge

volumes:
  user_postgres_data:
  todo_postgres_data: