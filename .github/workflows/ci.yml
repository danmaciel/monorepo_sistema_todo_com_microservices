name: Services CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  java-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, eureka-server, user-service, todo-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: packages/${{ matrix.service }}/pom.xml
      - name: Verify service
        run: mvn -B -f packages/${{ matrix.service }}/pom.xml verify
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
