name: Docker Compose E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Generate disposable CI credentials
        shell: bash
        run: |
          echo "USER_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "TODO_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "AUTH_REFRESH_CSRF_KEY_BASE64=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Build and start backend services
        env:
          JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS: 'false'
          AUTH_REFRESH_HTTP_ENABLED: 'true'
          AUTH_REFRESH_ALLOWED_ORIGINS: 'http://localhost:3000,https://localhost:3000'
        run: docker compose up --build -d user-db todo-db zipkin eureka user-service todo-service gateway
      - name: Verify service availability and business scenario via Gateway
        env:
          E2E_REFRESH_ENABLED: "true"
        run: python3 scripts/e2e_gateway.py
      - name: Verify minimum database schema contract (read-only)
        run: python3 scripts/verify_db_schema.py
      - name: Set up Node for HTTPS Vite browser test
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          python3 -m pip install --user playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Create disposable local HTTPS certificate
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/todo-local.key" \
            -out "$RUNNER_TEMP/todo-local.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null
          echo "DEV_HTTPS_CERT=$RUNNER_TEMP/todo-local.crt" >> "$GITHUB_ENV"
          echo "DEV_HTTPS_KEY=$RUNNER_TEMP/todo-local.key" >> "$GITHUB_ENV"
      - name: Launch opt-in HTTPS frontend
        shell: bash
        env:
          VITE_SESSION_AUTH: 'true'
          VITE_API_URL: http://127.0.0.1:8080
        run: |
          nohup npm run dev --workspace=web-app -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in {1..40}; do
            if curl -k -f -s https://localhost:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Local HTTPS frontend could not start"
          exit 1
      - name: Exercise browser login, refresh and logout with Chromium
        env:
          E2E_BROWSER_ENABLED: 'true'
        run: python3 scripts/e2e_browser.py
      - name: Exercise two-tab stale-CSRF regression with Chromium
        env:
          E2E_BROWSER_ENABLED: 'true'
        run: python3 scripts/e2e_two_tabs.py
      - name: Exercise Web Locks refresh with two Chromium tabs
        env:
          E2E_BROWSER_ENABLED: 'true'
        run: python3 scripts/e2e_web_locks.py
      - name: Assert traces are exported to Zipkin
        run: python3 scripts/verify_traces.py
      - name: Verify Todo CRUD survives User Service outage
        run: python3 scripts/e2e_user_service_outage.py
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100 --no-color
      - name: Tear down disposable services and volumes
        if: always()
        run: docker compose down -v --remove-orphans
