server:
  port: 8082

spring:
  application:
    name: todo-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/todosdb}
    username: ${DB_USERNAME:todos_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: todo_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET}
  # Set false only after all previously issued 24h JWTs have expired.
  accept-legacy-without-claims: ${JWT_ACCEPT_LEGACY_WITHOUT_CLAIMS:true}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      user-service:
        url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    '[com.todo]': DEBUG