server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
                - name: RequestSize
                  args:
                    maxSize: 10MB
        
            - id: todo-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/todos/**
              filters:
                - StripPrefix=1
                - name: RequestSize
                  args:
                    maxSize: 10MB
      
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ["http://localhost:3000", "http://localhost:5173"]
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: false
                maxAge: 3600
      
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      access: read-only

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO